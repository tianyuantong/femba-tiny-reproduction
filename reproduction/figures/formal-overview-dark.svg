<text x='52' y='28' font-size='17' fill='#f0efec' font-weight='600' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif'>正式线三任务 INT8 对比与 TUAB 训练后量化（PTQ）掉点恢复</text>
<text x='52' y='47' font-size='11.5' fill='#c3c2b7' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif'>FEMBA-Tiny · 受试者独立划分 · RTX 5060 Ti · 柱高为 3 个随机种子均值，误差线为种子范围（42 / 43 / 44）</text>
